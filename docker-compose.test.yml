name: gearshare-test

# Alternative, standing test stack. `make test-integration`/`test-e2e` use
# testcontainers-go instead (each test spins up and tears down its own
# MySQL container automatically — see internal/booking/repository_integration_test.go
# and test/e2e/booking_flow_test.go), so this file isn't required for that.
# It's kept for manually poking at an isolated test database, or for a CI
# setup that prefers one long-lived service container over many short-lived
# ones. Separate ports/volumes from docker-compose.yml so both can run at once.
services:
  mysql-test:
    image: mysql:8.4
    container_name: gearshare-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gearshare_test
    ports:
      - "3406:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    container_name: gearshare-redis-test
    ports:
      - "6479:6379"
