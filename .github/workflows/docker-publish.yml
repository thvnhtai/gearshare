name: Docker Publish

# Only builds/pushes on a version tag — from a commit that has already
# passed ci.yml on its way to being tagged, per docs/security/owasp-top10-mapping.md's
# A08 (Software and Data Integrity Failures) note: nothing gets built into
# an image without going through the test suite first.
on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, notification, indexer, thumbnail-fn]
        include:
          - service: api
            image_name: api
          - service: notification
            image_name: notification-service
          - service: indexer
            image_name: search-indexer
          - service: thumbnail-fn
            image_name: thumbnail-fn
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
