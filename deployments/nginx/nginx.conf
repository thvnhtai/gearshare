worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Rate limiting at the edge, in front of the app's own per-IP limiter
    # (internal/middleware/ratelimit.go) — a second, cheaper layer that
    # rejects abusive traffic before it even reaches a Go process.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream gearshare_api {
        server api:8080;
    }

    # Plain HTTP: redirect everything to HTTPS.
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers (defense in depth alongside the app's own —
        # internal/middleware/csp.go — since Nginx is the actual edge here).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://gearshare_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://gearshare_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /partner/ {
            proxy_pass http://gearshare_api;
            proxy_set_header Host $host;
        }

        # WebSocket needs the Upgrade/Connection headers explicitly — a
        # plain proxy_pass location (like /api/ above) does not forward
        # them, which is why this is a separate location block.
        location /ws/ {
            proxy_pass http://gearshare_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
