apiVersion: v1
kind: ConfigMap
metadata:
  name: gearshare-config
data:
  APP_ENV: "production"
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  CORS_ORIGIN: "https://gearshare.example.com"
  REDIS_ADDR: "gearshare-redis:6379"
  MONGO_URI: "mongodb://gearshare-mongo:27017"
  MONGO_DATABASE: "gearshare"
  KAFKA_BROKERS: "gearshare-kafka:9092"
  RABBITMQ_URL: "amqp://guest:guest@gearshare-rabbitmq:5672/"
  ELASTICSEARCH_ADDR: "http://gearshare-elasticsearch:9200"
  SEARCH_INDEXER_ADDR: "gearshare-search-indexer:9092"
  NOTIFICATION_ADDR: "gearshare-notification-service:9091"
  USER_SERVICE_ADDR: "gearshare-api:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "gearshare-jaeger:4318"
  INTERNAL_BASIC_USER: "admin"
