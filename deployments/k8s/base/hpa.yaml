# Requires the metrics-server addon to be running in the cluster
# (kind: https://github.com/kubernetes-sigs/metrics-server) — without it,
# HPA objects are created but never scale because they have no CPU
# utilization data to act on.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gearshare-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gearshare-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
