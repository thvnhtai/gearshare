# Placeholder Secret for local kind/minikube use only — every value here is
# a dev-only default, the same ones docker-compose.yml uses, checked in
# deliberately for a portfolio project that needs to be runnable without a
# secrets-management setup. A real deployment replaces this entire file
# with one generated by a secrets manager (Sealed Secrets, External
# Secrets Operator, Vault, etc.) and never commits real values to git.
apiVersion: v1
kind: Secret
metadata:
  name: gearshare-secrets
type: Opaque
stringData:
  MYSQL_PRIMARY_DSN: "gearshare_app:app_password@tcp(gearshare-mysql-primary:3306)/gearshare?parseTime=true&multiStatements=true"
  MYSQL_REPLICA_DSN: "gearshare_app:app_password@tcp(gearshare-mysql-replica:3306)/gearshare?parseTime=true&multiStatements=true"
  JWT_SECRET: "dev-only-change-me"
  SESSION_SECRET: "dev-only-change-me"
  API_KEY_PEPPER: "dev-only-change-me"
  INTERNAL_BASIC_PASS: "dev-only-change-me"
