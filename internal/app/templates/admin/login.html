<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GearShare Admin — Log In</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f7f5f2; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; border: 1px solid #e2e0d8; border-radius: 10px; padding: 1.5rem; width: 340px; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 0.75rem; border: 1px solid #e2e0d8; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 0.6rem; background: #2f6b3f; color: #fff; border: none; border-radius: 6px; font-weight: 600; }
    .error { color: #b3401f; font-size: 0.9rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>GearShare Admin</h2>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="POST" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="email" name="email" placeholder="Admin email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
