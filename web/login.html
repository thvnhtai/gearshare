<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GearShare — Log In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🏕️ GearShare</a>
    <nav class="site-nav" id="site-nav"></nav>
  </header>

  <main>
    <div class="card" style="max-width:420px;">
      <h1>Log in</h1>
      <p id="error" class="error-message" hidden></p>
      <form class="stack" id="login-form">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required />
        </div>
        <button type="submit">Log in</button>
      </form>

      <hr style="margin:1.25rem 0;border:none;border-top:1px solid var(--color-border);" />

      <!-- OAuth2 + OIDC: distinct auth style from the JWT-password flow above.
           See internal/auth/oauth_google.go / oidc.go (Phase 4). -->
      <a href="/api/v1/auth/oauth/google" class="button" style="display:block;text-align:center;">
        <button type="button" class="secondary" style="width:100%;" onclick="window.location.href='/api/v1/auth/oauth/google'">
          Continue with Google
        </button>
      </a>

      <p class="muted">No account yet? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("error");
      errorBox.hidden = true;
      try {
        const result = await GearShare.login(
          document.getElementById("email").value,
          document.getElementById("password").value
        );
        GearShare.setSession(result.access_token, result.user);
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });
  </script>
</body>
</html>
